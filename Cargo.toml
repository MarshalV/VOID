[package]
name = "p2p-messenger"
version = "0.1.0"
edition = "2021"

[dependencies]
libp2p = { version = "0.56", features = ["tcp", "quic", "noise", "yamux", "ping", "macros", "tokio", "mdns", "request-response", "identify", "kad", "relay", "dcutr", "autonat", "upnp", "dns", "rsa", "ed25519", "secp256k1", "json"] }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
eframe = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25"
aes-gcm = "0.10"
rand = "0.8"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
blake2 = "0.10"
bincode = "1.3"
zeroize = { version = "1.7", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rfd = { version = "0.15", default-features = false, features = ["file-handle-inner"] }


[profile.dev]
incremental = false
debug = 0
panic = "abort"
codegen-units = 1
split-debuginfo = "off"

[profile.release]
incremental = false
debug = 0
strip = true
lto = "thin"
panic = "abort"
