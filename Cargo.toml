[package]
name = "p2p-messenger"
version = "0.1.0"
edition = "2021"

[dependencies]
libp2p = { version = "0.56", features = ["tcp", "quic", "noise", "yamux", "ping", "macros", "tokio", "mdns", "request-response", "identify", "kad", "relay", "dcutr", "autonat", "upnp", "dns", "rsa", "ed25519", "secp256k1", "json"] }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
eframe = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25"
aes-gcm = "0.10"
rand = "0.8"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
blake2 = "0.10"
bincode = "1.3"
zeroize = { version = "1.7", features = ["derive"] }
argon2 = "0.5"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
cpal = "0.15"
hound = "3.5"
lofty = "0.22"
mp4ameta = "0.13"
lopdf = "0.34"
zip = "2.2"
tray-icon = "0.19"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-dpapi = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["file-handle-inner"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "dragonfly", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["file-handle-inner", "xdg-portal", "tokio"] }


[profile.dev]
incremental = false
debug = 0
panic = "abort"
codegen-units = 1
split-debuginfo = "off"

[profile.release]
incremental = false
debug = 0
strip = true
lto = "thin"
panic = "abort"
