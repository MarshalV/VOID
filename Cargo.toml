[package]
name = "p2p-messenger"
version = "0.1.0"
edition = "2021"

[dependencies]
libp2p = { version = "0.56", features = ["tcp", "noise", "yamux", "ping", "macros", "tokio", "mdns", "gossipsub"] }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
eframe = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
incremental = false
debug = 0
panic = "abort"
codegen-units = 1
split-debuginfo = "off"

[profile.release]
incremental = false
debug = 0
strip = true
lto = "thin"
panic = "abort"
