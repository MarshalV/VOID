[package]
name = "p2p-messenger"
version = "0.1.0"
edition = "2024"

[dependencies]
libp2p = { version = "0.56", features = ["tcp", "quic", "dns", "noise", "yamux", "ping", "macros", "tokio", "mdns", "kad", "identify", "relay", "dcutr", "autonat", "upnp", "websocket", "rsa", "secp256k1", "ecdsa", "tls"] }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
eframe = "0.29"
