[package]
name = "void-protocol"
version = "0.1.0"
edition = "2021"
description = "VOID wire protocol facade: re-exports frames, session, envelope, onion, and DHT rules"
license = "MIT"

[dependencies]
void-frames = { path = "void-frames" }
void-session = { path = "void-session" }
void-envelope = { path = "void-envelope" }
void-onion = { path = "void-onion" }
void-kad-rules = { path = "void-kad-rules" }
libp2p = { version = "0.56", features = ["kad", "ed25519"] }
anyhow = "1.0"
serde_json = "1.0"
rand = "0.8"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }

[dev-dependencies]
void-session = { path = "void-session", features = ["test-vectors"] }
