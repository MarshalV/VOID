[package]
name = "void-onion"
version = "0.1.0"
edition = "2021"
description = "VOID onion cells: v1/v2 wrap and peel, hop descriptors"
license = "MIT"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
blake2 = "0.10"
multiaddr = "0.18"
multihash = "0.19"
bs58 = "0.5"
