[package]
name = "void-frames"
version = "0.1.0"
edition = "2021"
description = "VOID frames: V1Packet, JSON and CBOR encode/decode, field limits"
license = "MIT"

[dependencies]
void-session = { path = "../void-session" }
void-envelope = { path = "../void-envelope" }
void-onion = { path = "../void-onion" }
libp2p-identity = { version = "0.2.13", features = ["ed25519", "peerid"] }
multiaddr = "0.18"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
cbor4ii = { version = "0.3.2", features = ["serde1", "use_std"] }
rand = "0.8"
blake2 = "0.10"
