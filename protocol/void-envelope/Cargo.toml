[package]
name = "void-envelope"
version = "0.1.0"
edition = "2021"
description = "VOID offline envelope: prekey, seal and open"
license = "MIT"

[dependencies]
void-session = { path = "../void-session" }
libp2p-identity = { version = "0.2.13", features = ["ed25519", "peerid"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
curve25519-dalek = "4.1"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
bincode = "1.3"
zeroize = { version = "1.7", features = ["derive"] }
