[package]
name = "void-mls"
version = "0.1.0"
edition = "2021"
description = "VOID group MLS: OpenMLS over the RustCrypto provider"
license = "MIT"

[dependencies]
openmls = "0.9"
openmls_rust_crypto = "0.6"
openmls_basic_credential = "0.6"
openmls_traits = "0.6"
tls_codec = { version = "0.5", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
base64 = "0.22"
hex = "0.4"
